lay:none!important}@media(max-width:730px){.grid{grid-template-columns:1fr}.shell{margin:12px auto}}</style></head><body><header><h1>시 처방소</h1><small>고민을 고르고 마음에 닿는 시를 찾아보세요. 고민 내용은 수집·전송하지 않습니다.</small></header><main class="shell"><div class="warning">시가 마음을 돌보는 데 도움이 될 수 있지만 상담이나 치료를 대신하지는 않습니다. 지금 안전이 걱정된다면 가까운 선생님이나 보호자에게 바로 이야기하세요.</div><div class="grid"><aside><section class="box"><h2>고민 찾기</h2><label for="query">시·시인·고민 검색</label><input id="query" type="search" placeholder="예: 외로움, 서시"><p class="muted">분류 선택</p><div id="filters" class="chips"></div></section></aside><div><section class="box"><h2>세부 고민</h2><div id="concerns" class="chips"></div></section><div id="total" class="count"></div><div id="results"></div></div></div></main><script id="seed" type="application/json">{"categories":{"진로·미래":["진로를 모르겠어요","꿈이 자꾸 바뀌어요","선택이 두려워요","실패가 두려워요","남과 비교해요"],"공부·성적":["성적이 떨어졌어요","시험이 두려워요","공부할 의욕이 없어요","노력이 헛된 것 같아요"],"친구·관계":["친구와 다퉜어요","혼자인 것 같아요","친구에게 서운해요","새 친구가 어려워요","상처 주는 말이 힘들어요"],"가족·집":["부모님과 갈등이 있어요","집에서 외로워요","기대가 부담스러워요"],"나·자존감":["내가 싫어요","자신감이 없어요","있는 그대로 인정받고 싶어요","외모가 신경 쓰여요"],"사랑·이별":["좋아하는 마음이 생겼어요","짝사랑이 힘들어요","헤어짐이 슬퍼요"],"불안·스트레스":["마음이 불안해요","잠시 쉬고 싶어요","앞일이 걱정돼요","마음이 복잡해요"],"무기력·외로움":["아무것도 하기 싫어요","외로워요","위로가 필요해요"],"상실·그리움":["그리운 사람이 있어요","이별을 받아들이기 어려워요","추억을 간직하고 싶어요"],"성장·희망":["다시 시작하고 싶어요","용기가 필요해요","천천히 성장하고 싶어요","오늘을 잘 살고 싶어요"]},"poems":[{"id":"p1","author":"윤동주","title":"서시","tags":["진로를 모르겠어요","선택이 두려워요","시험이 두려워요","혼자인 것 같아요","내가 싫어요","있는 그대로 인정받고 싶어요","마음이 복잡해요","용기가 필요해요","오늘을 잘 살고 싶어요"],"rights":"full","fullText":"죽는 날까지 하늘을 우러러\n한 점 부끄럼이 없기를,\n잎새에 이는 바람에도\n나는 괴로워했다.\n별을 노래하는 마음으로\n모든 죽어가는 것을 사랑해야지\n그리고 나한테 주어진 길을\n걸어가야겠다.\n\n오늘 밤에도 별이 바람에 스치운다.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EC%84%9C%EC%8B%9C%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p2","author":"윤동주","title":"별 헤는 밤","tags":["외로워요","그리운 사람이 있어요","추억을 간직하고 싶어요"],"rights":"full","fullText":"계절이 지나가는 하늘에는\n가을로 가득 차 있습니다.\n\n나는 아무 걱정도 없이\n가을 속의 별들을 다 헤일 듯합니다.\n\n가슴속에 하나둘 새겨지는 별을\n이제 다 못 헤는 것은\n쉬이 아침이 오는 까닭이요,\n내일 밤이 남은 까닭이요,\n아직 나의 청춘이 다하지 않은 까닭입니다.\n\n별 하나에 추억과\n별 하나에 사랑과\n별 하나에 쓸쓸함과\n별 하나에 동경과\n별 하나에 시와\n별 하나에 어머니, 어머니,\n\n어머님, 나는 별 하나에 아름다운 말 한마디씩 불러 봅니다. 소학교 때 책상을 같이 했던 아이들의 이름과, 패, 경, 옥, 이런 이국 소녀들의 이름과, 벌써 아기 어머니 된 계집애들의 이름과, 가난한 이웃 사람들의 이름과, 비둘기, 강아지, 토끼, 노새, 노루, ‘프랑시스 잠’, ‘라이너 마리아 릴케’ 이런 시인의 이름을 불러 봅니다.\n\n이네들은 너무나 멀리 있습니다.\n별이 아스라이 멀듯이.\n\n어머님,\n그리고 당신은 멀리 북간도에 계십니다.\n\n나는 무엇인지 그리워\n이 많은 별빛이 내린 언덕 위에\n내 이름자를 써 보고\n흙으로 덮어 버리었습니다.\n\n딴은 밤을 새워 우는 벌레는\n부끄러운 이름을 슬퍼하는 까닭입니다.\n\n그러나 겨울이 지나고 나의 별에도 봄이 오면\n무덤 위에 파란 잔디가 피어나듯이\n내 이름자 묻힌 언덕 위에도\n자랑처럼 풀이 무성할 거외다.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EB%B3%84%20%ED%97%A4%EB%8A%94%20%EB%B0%A4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p3","author":"윤동주","title":"자화상","tags":["실패가 두려워요","내가 싫어요","자신감이 없어요","있는 그대로 인정받고 싶어요","마음이 복잡해요"],"rights":"full","fullText":"산모퉁이를 돌아 논가 외딴 우물을 홀로\n찾아가선 가만히 들여다봅니다.\n\n우물 속에는 달이 밝고 구름이 흐르고\n하늘이 펼치고 파아란 바람이 불고 가을이 있습니다.\n\n그리고 한 사나이가 있습니다.\n어쩐지 그 사나이가 미워져 돌아갑니다.\n\n돌아가다 생각하니 그 사나이가 가엾어집니다. 도로 가 들여다보니 사나이는 그대로 있습니다.\n\n다시 그 사나이가 미워져 돌아갑니다.\n돌아가다 생각하니 그 사나이가 그리워집니다.\n\n우물 속에는 달이 밝고 구름이 흐르고 하늘이 펼치고 파아란 바람이 불고 가을이 있고 추억처럼 사나이가 있습니다.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EC%9E%90%ED%99%94%EC%83%81%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p4","author":"윤동주","title":"참회록","tags":["내가 싫어요","다시 시작하고 싶어요"],"rights":"full","fullText":"파란 녹이 낀 구리 거울 속에\n내 얼굴이 남아 있는 것은\n어느 왕조의 유물이기에\n이다지도 욕될까.\n\n나는 나의 참회의 글을 한 줄에 줄이자.\n― 만 이십사 년 일 개월을\n무슨 기쁨을 바라 살아왔던가.\n\n내일이나 모레나 그 어느 즐거운 날에\n나는 또 한 줄의 참회록을 써야 한다.\n― 그때 그 젊은 나이에\n왜 그런 부끄런 고백을 했던가.\n\n밤이면 밤마다 나의 거울을\n손바닥으로 발바닥으로 닦아 보자.\n\n그러면 어느 운석 밑으로 홀로 걸어가는\n슬픈 사람의 뒷모양이\n거울 속에 나타나 온다.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EC%B0%B8%ED%9A%8C%EB%A1%9D%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p5","author":"윤동주","title":"쉽게 씌어진 시","tags":["진로를 모르겠어요","공부할 의욕이 없어요","자신감이 없어요"],"rights":"full","fullText":"창밖에 밤비가 속살거려\n육첩방은 남의 나라,\n\n시인이란 슬픈 천명인 줄 알면서도\n한 줄 시를 적어 볼까,\n\n땀내와 사랑내 포근히 품긴\n보내 주신 학비 봉투를 받아\n\n대학 노트를 끼고\n늙은 교수의 강의 들으러 간다.\n\n생각해 보면 어린 때 동무를\n하나, 둘, 죄다 잃어버리고\n\n나는 무얼 바라\n나는 다만, 홀로 침전하는 것일까?\n\n인생은 살기 어렵다는데\n시가 이렇게 쉽게 씌어지는 것은\n부끄러운 일이다.\n\n육첩방은 남의 나라,\n창밖에 밤비가 속살거리는데,\n\n등불을 밝혀 어둠을 조금 내몰고,\n시대처럼 올 아침을 기다리는 최후의 나,\n\n나는 나에게 작은 손을 내밀어\n눈물과 위안으로 잡는 최초의 악수.\n","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EC%89%BD%EA%B2%8C%20%EC%94%8C%EC%96%B4%EC%A7%84%20%EC%8B%9C%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p6","author":"윤동주","title":"새로운 길","tags":["선택이 두려워요","아무것도 하기 싫어요","다시 시작하고 싶어요","용기가 필요해요"],"rights":"full","fullText":"내를 건너서 숲으로\n고개를 넘어서 마을로\n\n어제도 가고 오늘도 갈\n나의 길 새로운 길\n\n민들레가 피고 까치가 날고\n아가씨가 지나고 바람이 일고\n\n나의 길은 언제나 새로운 길\n오늘도…… 내일도……\n\n내를 건너서 숲으로\n고개를 넘어서 마을로","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EC%83%88%EB%A1%9C%EC%9A%B4%20%EA%B8%B8%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p7","author":"윤동주","title":"길","tags":["진로를 모르겠어요","꿈이 자꾸 바뀌어요","앞일이 걱정돼요"],"rights":"undetermined","fullText":"잃어 버렸습니다\n무얼 어디다 잃었는지 몰라\n두 손이 주머니를 더듬어\n길에 나아갑니다\n\n돌과 돌과 돌이 끝없이 연달아\n길은 돌담을 끼고 갑니다\n\n담은 쇠문을 굳게 닫아\n길 위에 긴 그림자를 드리우고\n\n길은 아침에서 저녁으로\n저녁에서 아침으로 통했습니다\n\n돌담을 더듬어 눈물짓다\n쳐다보면 하늘은 부끄럽게 푸릅니다\n\n풀 한 포기 없는 이 길을 걷는 것은\n담 저쪽에 내가 남아 있는 까닭이고\n\n내가 사는 것은, 다만,\n잃은 것을 찾는 까닭입니다\n","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EA%B8%B8%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p8","author":"윤동주","title":"병원","tags":["집에서 외로워요","위로가 필요해요"],"rights":"full","fullText":"살구나무 그늘로 얼굴을 가리고, 병원 뒤뜰에 누워, 젊은 여자가 흰 옷 아래로 하얀 다리를 드러내 놓고 일광욕을 한다.\n한나절이 기울도록 가슴을 앓는다는 이 여자를 찾아오는 이, 나비 한 마리도 없다.\n슬프지도 않은 살구나무 가지에는 바람조차 없다.\n\n나도 모를 아픔을 오래 참다 처음으로 이곳에 찾아왔다.\n그러나 나의 늙은 의사는 젊은이의 병을 모른다. 나에게는 병이 없다고 한다.\n이 지나친 시련, 이 지나친 피로, 나는 성내서는 안 된다.\n\n여자는 자리에서 일어나 옷깃을 여미고 화단에서 금잔화(金盞花) 한 포기를 따 가슴에 꽂고 병실 안으로 사라진다.\n나는 그 여자의 건강이, 아니 내 건강도 속히 회복되기를 바라며 그가 누웠던 자리에 누워 본다.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EB%B3%91%EC%9B%90%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p9","author":"윤동주","title":"흰 그림자","tags":["실패가 두려워요","내가 싫어요","자신감이 없어요","마음이 복잡해요"],"rights":"full","fullText":"황혼이 짙어지는 길모금에서\n하루 종일 시들은 귀를 가만히 기울이면\n땅거미 옮겨지는 발자취소리,\n\n발자취소리를 들을 수 있도록\n나는 총명했던가요.\n\n이제 어리석게도 모든 것을 깨달은 다음\n오래 마음 깊은 속에\n괴로워하든 수많은 나를\n하나, 둘 제 고장으로 돌려보내면\n거리 모퉁이 어둠 속으로\n소리 없이 사라지는 흰 그림자,\n\n흰 그림자들\n연연히 사랑하는 흰 그림자들、\n\n내 모든 것을 돌려보낸 뒤\n허전히 뒷골목을 돌아\n황혼처럼 물드는 내방으로 돌아오면\n\n신념이 깊은 의젓한 양처럼\n하루 종일 시름없이 풀포기나 뜯자.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%ED%9D%B0%20%EA%B7%B8%EB%A6%BC%EC%9E%90%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p10","author":"윤동주","title":"또 다른 고향","tags":["집에서 외로워요","내가 싫어요"],"rights":"full","fullText":"고향에 돌아온 날 밤에\n내 백골이 따라와 한 방에 누웠다.\n\n어둔 방은 우주로 통하고\n하늘에선가 소리처럼 바람이 불어온다.\n\n어둠 속에서 곱게 풍화작용하는\n백골을 들여다 보며\n눈물 짓는 것이 내가 우는 것이냐\n백골이 우는 것이냐\n아름다운 혼이 우는 것이냐\n\n지조 높은 개는\n밤을 새워 어둠을 짖는다.\n\n어둠을 짖는 개는\n나를 쫓는 것일 게다.\n\n가자 가자\n쫓기우는 사람처럼 가자.\n백골 몰래\n아름다운 또 다른 고향에 가자.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EB%98%90%20%EB%8B%A4%EB%A5%B8%20%EA%B3%A0%ED%96%A5%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p11","author":"윤동주","title":"눈 오는 지도","tags":["외로워요","그리운 사람이 있어요"],"rights":"full","fullText":"순이가 떠난다는 아침에 말 못할 마음으로 함박눈이 나려,\n슬픈것처럼 창 밖에 아득히 깔린 지도 위에 덮인다.\n방 안을 돌아다 보아야 아무도 없다.\n벽과 천정이 하얗다.\n방 안에서까지 눈이 나리는 것일까,\n정말 너는 잃어버린 역사처럼 홀홀이 가는 것이냐,\n떠나기 전에 일러둘 말이 있던 것을 편지를 써서도 네가 가는 곳을 몰라\n어느 거리, 어느 마을, 어느 지붕밑, 너는 내 마음속에만 남아 있는것이냐,\n네 쪼고만 발자욱을 눈이 자꼬 나벼 덮여 따라갈수도 없다.\n눈이 녹으면 남는 발자욱자리마다 꽃이 피리니 꽃사이로 발자욱을 찾어 나서면\n일년 열두달 하냥 내 마음에는 눈이 나리리라.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EB%88%88%20%EC%98%A4%EB%8A%94%20%EC%A7%80%EB%8F%84%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p12","author":"윤동주","title":"십자가","tags":["노력이 헛된 것 같아요","용기가 필요해요"],"rights":"full","fullText":"쫓아오던 햇빛인데,\n지금 교회당 꼭대기\n십자가에 걸리었습니다.\n\n첨탑이 저렇게도 높은데,\n어떻게 올라갈 수 있을까요.\n\n종소리도 들려오지 않는데\n휘파람이나 불며\n서성거리다가,\n\n괴로웠던 사나이,\n행복한 예수 그리스도에게\n처럼\n십자가가 허락된다면\n\n모가지를 드리우고\n꽃처럼 피어나는 피를\n어두워 가는 하늘 밑에\n조용히 흘리겠습니다.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EC%8B%AD%EC%9E%90%EA%B0%80%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p13","author":"윤동주","title":"소년","tags":["좋아하는 마음이 생겼어요","천천히 성장하고 싶어요"],"rights":"full","fullText":"여기저기서 단풍잎 같은 슬픈 가을이 뚝뚝 떨어진다.\n\n단풍잎 떨어져 나온 자리마다 봄을 마련해 놓고 나뭇가지 위에 하늘이 펼쳐 있다. 가만히 하늘을 들여다보려면 눈썹에 파란 물감이 든다. 두 손으로 따뜻한 볼을 씻어 보면 손바닥에도 파란 물감이 묻어난다. 다시 손바닥을 들여다본다. 손금에는 맑은 강물이 흐르고, 맑은 강물이 흐르고, 강물 속에는 사랑처럼 슬픈 얼굴 아름다운 순이의 얼굴이 어린다.\n\n소년은 황홀히 눈을 감아 본다. 그래도 맑은 강물은 흘러 사랑처럼 슬픈 얼굴 아름다운 순이의 얼굴은 어린다.","url":"https://www.google.com/search?q=%EC%9C%A4%EB%8F%99%EC%A3%BC%20%EC%86%8C%EB%85%84%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p14","author":"김소월","title":"진달래꽃","tags":["헤어짐이 슬퍼요","이별을 받아들이기 어려워요"],"rights":"full","fullText":"나 보기가 역겨워\n가실 때에는\n말없이 고이 보내드리우리다\n\n영변에 약산\n진달래꽃\n아름 따다 가실 길에 뿌리우리다\n\n가시는 걸음걸음\n놓인 그 꽃을\n사뿐히 즈려밟고 가시옵소서\n\n나 보기가 역겨워\n가실 때에는\n죽어도 아니 눈물 흘리우리다","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EC%A7%84%EB%8B%AC%EB%9E%98%EA%BD%83%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p15","author":"김소월","title":"초혼","tags":["그리운 사람이 있어요","이별을 받아들이기 어려워요"],"rights":"full","fullText":"산산이 부서진 이름이여!\n허공 중에 헤어진 이름이여!\n불러도 주인 없는 이름이여!\n부르다가 내가 죽을 이름이여!\n\n심중에 남아 있는 말 한마디는\n끝끝내 마저 하지 못하였구나.\n사랑하던 그 사람이여!\n사랑하던 그 사람이여!\n\n붉은 해는 서산마루에 걸리었다.\n사슴의 무리도 슬피 운다.\n떨어져 나가 앉은 산 위에서\n나는 그대의 이름을 부르노라.\n\n설움에 겹도록 부르노라.\n설움에 겹도록 부르노라.\n부르는 소리는 비껴 가지만\n하늘과 땅 사이가 너무 넓구나\n\n선 채로 이 자리에 돌이 되어도\n부르다가 내가 죽을 이름이여!\n사랑하던 그 사람이여!\n사랑하던 그 사람이여!","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EC%B4%88%ED%98%BC%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p16","author":"김소월","title":"엄마야 누나야","tags":["집에서 외로워요","위로가 필요해요"],"rights":"full","fullText":"엄마야 누나야 강변 살자\n뜰에는 반짝이는 금모래 빛\n뒷문 밖에는 갈잎의 노래\n엄마야 누나야 강변 살자","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EC%97%84%EB%A7%88%EC%95%BC%20%EB%88%84%EB%82%98%EC%95%BC%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p17","author":"김소월","title":"못 잊어","tags":["짝사랑이 힘들어요","추억을 간직하고 싶어요"],"rights":"full","fullText":"못 잊어 생각이 나겠지요\n그런대로 한 세상 지내시구려\n사노라면 잊힐 날 있으리다\n\n못 잊어 생각이 나겠지요\n그런대로 세월만 가라시구려\n못 잊어도 더러는 잊히오리다.\n\n그러나 또 한긋 이렇지요,\n그리워 살뜰히 못 잊는데\n어쩌면 생각이 떠지나요?","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EB%AA%BB%20%EC%9E%8A%EC%96%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p18","author":"김소월","title":"먼 후일","tags":["짝사랑이 힘들어요","헤어짐이 슬퍼요"],"rights":"full","fullText":"먼 훗날 당신이 찾으시면\n그때에 내 말이 \"잊었노라\"\n\n당신이 속으로 나무라면\n\"무척 그리다가 잊었노라\"\n\n그래도 당신이 나무라면\n\"믿기지 않아서 잊었노라\"\n\n오늘도 어제도 아니 잊고\n먼 훗날 그때에 \"잊었노라\"","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EB%A8%BC%20%ED%9B%84%EC%9D%BC%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p19","author":"김소월","title":"가는 길","tags":["선택이 두려워요","그리운 사람이 있어요"],"rights":"full","fullText":"그립다\n말을 할까\n하니 그리워\n\n그냥 갈까\n그래도\n다시 더 한 번……\n\n저 산(山)에도 가마귀, 들에 가마귀\n서산(西山)에는 해 진다고\n지저귑니다.\n\n앞 강물 뒷 강물\n흐르는 물은\n어서 따라오라고 따라가자고\n흘러도 연달아 흐릅디다려.","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EA%B0%80%EB%8A%94%20%EA%B8%B8%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p20","author":"김소월","title":"산유화","tags":["혼자인 것 같아요","외로워요"],"rights":"full","fullText":"산에는 꽃 피네\n꽃이 피네\n갈 봄 여름 없이\n꽃이 피네\n\n산에\n산에\n피는 꽃은\n저만치 혼자서 피어 있네\n\n산에서 우는 작은 새여\n꽃이 좋아\n산에서\n사노라네\n\n산에는 꽃 지네\n꽃이 지네\n갈 봄 여름 없이\n꽃이 지네","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EC%82%B0%EC%9C%A0%ED%99%94%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p21","author":"김소월","title":"접동새","tags":["집에서 외로워요","그리운 사람이 있어요"],"rights":"full","fullText":"접동\n접동\n아우래비 접동\n\n진두강 가람가에 살던 누나는\n진두강 앞마을에 와서 웁니다.\n\n옛날, 우리나라\n먼 뒤쪽의\n진두강 가람 가에 살던 누나는\n의붓어미 시샘에 죽었습니다\n\n누나라고 불러보랴\n오오 불설워\n시새움에 몸이 죽은 우리 누나는\n죽어서 접동새가 되었습니다\n\n아홉이나 남아 되던 오랩동생을\n죽어서도 못 잊어 차마 못 잊어\n야삼경 남 다 자는 밤이 깊으면\n이 산 저 산 옮아가며 슬피 웁니다.","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EC%A0%91%EB%8F%99%EC%83%88%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p22","author":"김소월","title":"예전엔 미처 몰랐어요","tags":["있는 그대로 인정받고 싶어요","오늘을 잘 살고 싶어요"],"rights":"full","fullText":"봄 가을 없이 밤마다 돋는 달도\n예전엔 미처 몰랐어요\n\n이렇게 사무치게 그리울 줄도\n예전엔 미처 몰랐어요\n\n달이 암만 밝아도 처다 볼 줄을\n예전엔 미처 몰랐어요\n\n이제금 저 달이 설움인 줄을\n예전엔 미처 몰랐어요","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EC%98%88%EC%A0%84%EC%97%94%20%EB%AF%B8%EC%B2%98%20%EB%AA%B0%EB%9E%90%EC%96%B4%EC%9A%94%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p23","author":"김소월","title":"개여울","tags":["짝사랑이 힘들어요","그리운 사람이 있어요"],"rights":"full","fullText":"당신은 무슨 일로\n그리 합니까?   \n홀로이 개여울에 주저앉아서 \n\n파릇한 풀포기가 \n돋아나오고 \n잔물은 봄바람에 헤적일 때에 \n\n가도 아주 가지는\n않노라시던   \n그러한 약속이 있었겠지요   \n\n날마다 개여울에\n나와 앉아서 \n하염없이 무엇을 생각합니다 \n\n가도 아주 가지는\n않노라심은 \n굳이 잊지 말라는 부탁인지요 ","url":"https://www.google.com/search?q=%EA%B9%80%EC%86%8C%EC%9B%94%20%EA%B0%9C%EC%97%AC%EC%9A%B8%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p24","author":"한용운","title":"님의 침묵","tags":["헤어짐이 슬퍼요","이별을 받아들이기 어려워요"],"rights":"full","fullText":"님은 갔습니다. 아아, 사랑하는 나의 님은 갔습니다.\n푸른 산빛을 깨치고 단풍나무 숲을 향하여 난 작은 길을 걸어서, 차마 떨치고 갔습니다.\n황금의 꽃같이 굳고 빛나던 옛 맹세는 차디찬 티끌이 되어서 한숨의 미풍에 날아갔습니다.\n날카로운 첫 키스의 추억은 나의 운명의 지침을 돌려놓고 뒷걸음쳐서 사라졌습니다.\n나는 향기로운 님의 말소리에 귀먹고, 꽃다운 님의 얼굴에 눈멀었습니다.\n사랑도 사람의 일이라 만날 때에 미리 떠날 것을 염려하고 경계하지 아니한 것은 아니지만,\n이별은 뜻밖의 일이 되고 놀란 가슴은 새로운 슬픔에 터집니다.\n그러나 이별을 쓸데없는 눈물의 원천을 만들고 마는 것은 스스로 사랑을 깨치는 것인 줄 아는 까닭에,\n걷잡을 수 없는 슬픔의 힘을 옮겨서 새 희망의 정수박이에 들어부었습니다.\n우리는 만날 때에 떠날 것을 염려하는 것과 같이 떠날 때에 다시 만날 것을 믿습니다.\n아아, 님은 갔지마는 나는 님을 보내지 아니하였습니다.\n제 곡조를 못 이기는 사랑의 노래는 님의 침묵을 휩싸고 돕니다.","url":"https://www.google.com/search?q=%ED%95%9C%EC%9A%A9%EC%9A%B4%20%EB%8B%98%EC%9D%98%20%EC%B9%A8%EB%AC%B5%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p25","author":"한용운","title":"알 수 없어요","tags":["진로를 모르겠어요","마음이 복잡해요"],"rights":"full","fullText":"바람도 없는 공중에 수직(垂直)의 파문을 내이며\n고요히 떨어지는 오동잎은 누구의 발자취입니까.\n지리한 장마 끝에 서풍에 몰려가는 무서운 검은 구름의 터진 틈으로\n언뜻언뜻 보이는 푸른 하늘은 누구의 얼굴입니까.\n\n꽃도 없는 깊은 나무에 푸른 이끼를 거쳐서 옛 탑(塔) 위의\n고요한 하늘을 스치는 알 수 없는 향기는 누구의 입김입니까.\n근원은 알지도 못할 곳에서 나서 돌뿌리를 울리고\n가늘게 흐르는 작은 시내는 구비구비 누구의 노래입니까.\n\n연꽃 같은 발꿈치로 가이 없는 바다를 밟고 옥 같은 손으로\n끝없는 하늘을 만지면서 떨어지는 해를 곱게 단장하는 저녁놀은 누구의 시(詩)입니까.\n\n타고 남은 재가 다시 기름이 됩니다.\n그칠 줄을 모르고 타는 나의 가슴은 누구의 밤을 지키는 약한 등불입니까.","url":"https://www.google.com/search?q=%ED%95%9C%EC%9A%A9%EC%9A%B4%20%EC%95%8C%20%EC%88%98%20%EC%97%86%EC%96%B4%EC%9A%94%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p26","author":"한용운","title":"복종","tags":["선택이 두려워요","기대가 부담스러워요"],"rights":"full","fullText":"남들은 자유를 사랑한다지마는, 나는\n복종을 좋아하여요\n자유를 모르는 것은 아니지만, 당신에게는\n복종만 하고 싶어요\n복종하고 싶은데 복종하는 것은\n아름다운 자유보다도 달콤합니다.\n그것이 나의 행복입니다.\n\n그러나, 당신이 나더러 다른 사람을\n복종하라면\n그것만은 복종할 수가 없읍니다.\n다른 사람을 복종하려면 당신에게\n복종할 수 없는 까닭입니다.","url":"https://www.google.com/search?q=%ED%95%9C%EC%9A%A9%EC%9A%B4%20%EB%B3%B5%EC%A2%85%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p27","author":"한용운","title":"당신을 보았습니다","tags":["위로가 필요해요","그리운 사람이 있어요"],"rights":"full","fullText":"당신이 가신 뒤로 나는 당신을 잊을 수가 없습니다\n까닭은 당신을 위하느니보다 나를 위함이 많습니다\n\n나는 갈고 심을 땅이 없으므로 추수(秋收)가 없습니다\n저녁거리가 없어서 조나 감자를 꾸려 이웃집에 갔더니 주인은 「거지는 인격이 없다 인격이 없는 사람은 생명이 없다 너를 도아주는 것은 죄악이다」고 말하였습니다\n그 말을 듣고 돌아 나올 때에 쏟아지는 눈물 속에서 당신을 보았습니다\n\n나는 집도 없고 다른 까닭을 겸하여 민적(民籍)이 없습니다\n「민적 없는 자는 인권이 없다 인권이 없는 너에게 무슨 정조(貞操)냐」 하고 능욕하려는 장군이 있었습니다\n그를 항거한 뒤에 남에게 대한 격분이 스스로의 슬픔으로 화(化)하는 찰나에 당신을 보았습니다\n\n아아 온갖 윤리, 도덕, 법률은 칼과 황금을 제사 지내는 연기(烟氣)인 줄을 알았습니다\n영원의 사랑을 받을까 인간 역사의 첫 페이지에 잉크칠을 할까 술을 마실까 망설일 때에 당신을 보았습니다","url":"https://www.google.com/search?q=%ED%95%9C%EC%9A%A9%EC%9A%B4%20%EB%8B%B9%EC%8B%A0%EC%9D%84%20%EB%B3%B4%EC%95%98%EC%8A%B5%EB%8B%88%EB%8B%A4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p28","author":"한용운","title":"나룻배와 행인","tags":["친구에게 서운해요","헤어짐이 슬퍼요"],"rights":"full","fullText":"나는 나룻배\n당신은 행인.\n\n당신은 흙발로 나를 짓밟습니다.\n나는 당신을 안고 물을 건너갑니다.\n나는 당신을 안으면 깊으나 얕으나 급한 여울이나 건너갑니다.\n\n만일 당신이 아니 오시면 나는 바람을 쐬고 눈비를 맞으며, 밤에서 낮까지 당신을 기다리고 있습니다.\n당신은 물만 건너면 나를 돌아보지도 않고 가십니다그려.\n그러나 당신이 언제든지 오실 줄만은 알아요.\n나는 당신을 기다리면서 날마다 날마다 낡아갑니다.\n\n나는 나룻배\n당신은 행인.","url":"https://www.google.com/search?q=%ED%95%9C%EC%9A%A9%EC%9A%B4%20%EB%82%98%EB%A3%BB%EB%B0%B0%EC%99%80%20%ED%96%89%EC%9D%B8%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p29","author":"한용운","title":"사랑하는 까닭","tags":["있는 그대로 인정받고 싶어요","좋아하는 마음이 생겼어요"],"rights":"full","fullText":"내가 당신을 사랑하는 것은 까닭이 없는 것이 아닙니다\n다른 사람들은 나의 홍(紅顔)만을 사랑하지마는 당신은\n나의 백발(白髮)도 사랑하는 까닭입니다.\n\n내가 당신을 그리워하는 것은 까닭이 없는 것이 아닙니다\n다른 사람들은 나의 미소만을 사랑하지마는 당신은 나의\n눈물도 사랑하는 까닭입니다.\n\n내가 당신을 기다리는 것은 까닭이 없는 것이 아닙니다\n다른 사람들은 나의 건강만을 사랑하지마는 당신은 나의\n주검도 사랑하는 까닭입니다.","url":"https://www.google.com/search?q=%ED%95%9C%EC%9A%A9%EC%9A%B4%20%EC%82%AC%EB%9E%91%ED%95%98%EB%8A%94%20%EA%B9%8C%EB%8B%AD%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p30","author":"이육사","title":"광야","tags":["앞일이 걱정돼요","용기가 필요해요"],"rights":"full","fullText":"까마득한 날에\n하늘이 처음 열리고\n어디 닭 우는 소리 들렸으랴.\n\n모든 산맥들이\n바다를 연모(戀慕)해 휘달릴 때도\n차마 이 곳을 범(犯)하던 못하였으리라.\n\n끊임없는 광음(光陰)을\n부지런한 계절이 피어선 지고\n큰 강물이 비로소 길을 열었다.\n\n지금 눈 내리고\n매화 향기 홀로 아득하니\n내 여기 가난한 노래의 씨를 뿌려라.\n\n다시 천고(千古)의 뒤에\n백마 타고 오는 초인(超人)이 있어\n이 광야에서 목놓아 부르게 하리라","url":"https://www.google.com/search?q=%EC%9D%B4%EC%9C%A1%EC%82%AC%20%EA%B4%91%EC%95%BC%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p31","author":"이육사","title":"청포도","tags":["위로가 필요해요","다시 시작하고 싶어요"],"rights":"full","fullText":"내 고장 칠월은\n청포도가 익어가는 시절.\n\n이 마을 전설이 주저리주저리 열리고\n먼 데 하늘이 꿈꾸려 알알이 들어와 박혀\n\n하늘 밑 푸른 바다가 가슴을 열고\n흰 돛단배가 곱게 밀려서 오면\n\n내가 바라는 손님은 고달픈 몸으로\n청포(靑袍)를 입고 찾아 온다고 했으니,\n\n내 그를 맞아, 이 포도를 따 먹으면\n두 손은 함뿍 적셔도 좋으련.\n\n아이야, 우리 식탁엔 은쟁반에\n하이얀 모시 수건을 마련해 두렴.\n","url":"https://www.google.com/search?q=%EC%9D%B4%EC%9C%A1%EC%82%AC%20%EC%B2%AD%ED%8F%AC%EB%8F%84%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p32","author":"이육사","title":"절정","tags":["실패가 두려워요","노력이 헛된 것 같아요"],"rights":"full","fullText":"매운 계절의 채찍에 갈겨\n마침내 북방으로 휩쓸려 오다.\n\n하늘도 그만 지쳐 끝난 고원\n서릿발 칼날진 그 위에 서다.\n\n어디다 무릎을 꿇어야 하나\n한 발 재겨 디딜 곳조차 없다.\n\n이러매 눈 감아 생각해 볼밖에\n겨울은 강철로 된 무지갠[41]가 보다.","url":"https://www.google.com/search?q=%EC%9D%B4%EC%9C%A1%EC%82%AC%20%EC%A0%88%EC%A0%95%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p33","author":"이육사","title":"교목","tags":["자신감이 없어요","용기가 필요해요"],"rights":"full","fullText":"푸른 하늘에 닿을 듯이\n세월에 불타고 우뚝 남아 서서\n차라리 봄도 꽃피진 말아라\n\n낡은 거미집 휘두르고\n끝없는 꿈길에 혼자 설레는\n마음은 아예 뉘우침 아니라\n\n검은 그림자 쓸쓸하면\n마침내 호수속 깊이 거꾸러져\n차마 바람도 흔들진 못해라","url":"https://www.google.com/search?q=%EC%9D%B4%EC%9C%A1%EC%82%AC%20%EA%B5%90%EB%AA%A9%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p34","author":"이육사","title":"꽃","tags":["다시 시작하고 싶어요","천천히 성장하고 싶어요"],"rights":"full","fullText":"동방은 하늘도 다 끝나고\n비 한 방울 내리잖는 그때에도\n오히려 꽃은 빨갛게 피지 않는가\n내 목숨을 꾸며 쉬임 없는 날이여\n\n북쪽 툰드라에도 찬 새벽은\n눈 속 깊이 꽃맹아리가 옴작거려\n제비떼 까맣게 날아오길 기다리나니\n마침내 저버리지 못한 약속이여\n\n한바다 복판 용솟음 치는 곳\n바람결 따라 타오르는 꽃 성에는\n나비처럼 취하는 회상의 무리들아\n오늘 내 여기서 너를 불러 보노라","url":"https://www.google.com/search?q=%EC%9D%B4%EC%9C%A1%EC%82%AC%20%EA%BD%83%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p35","author":"정지용","title":"향수","tags":["집에서 외로워요","추억을 간직하고 싶어요"],"rights":"full","fullText":"넓은 벌 동쪽 끝으로\n옛이야기 지줄대는 실개천이 회돌아 나가고,\n얼룩백이 황소[1]가\n해설피 금빛 게으른 울음을 우는 곳,\n—그 곳이 참하 꿈엔들 잊힐리야.\n\n질화로에 재가 식어지면\n뷔인 밭에 밤바람 소리 말을 달리고,\n엷은 조름에 겨운 늙으신 아버지가\n짚벼개를 돋아 고이시는 곳,\n—그 곳이 참하 꿈엔들 잊힐리야.\n\n흙에서 자란 내 마음\n파아란 하늘 빛이 그립어\n함부로 쏜 활살을 찾으려\n풀섶 이슬에 함추름 휘적시든 곳,\n—그 곳이 참하 꿈엔들 잊힐리야.\n\n傳說(전설)바다에 춤추는 밤물결 같은\n검은 귀밑머리 날리는 어린 누의와\n아무러치도 않고 여쁠것도 없는\n사철 발벗은 안해가\n따가운 해ㅅ살을 등에지고 이삭 줏던 곳,\n—그 곳이 참하 꿈엔들 잊힐리야.\n\n하늘에는 석근 별\n알수도 없는 모래성으로 발을 옮기고,\n서리 까마귀 우지짖고 지나가는 초라한 집웅,\n흐릿한 불빛에 돌아 앉어 도란 도란거리는 곳,\n—그 곳이 참하 꿈엔들 잊힐리야.","url":"https://www.google.com/search?q=%EC%A0%95%EC%A7%80%EC%9A%A9%20%ED%96%A5%EC%88%98%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p36","author":"정지용","title":"유리창 1","tags":["그리운 사람이 있어요","이별을 받아들이기 어려워요"],"rights":"full","fullText":"유리(琉璃)에 차고 슬픈 것이 어른거린다\n열없이 붙어 서서 입김을 흐리우니\n길들은 양 언 날개를 파다거린다.\n지우고 보고 지우고 보아도\n새까만 밤이 밀려나가고 밀려와 부딪히고,\n물 먹은 별이, 반짝, 보석처럼 박힌다.\n밤에 홀로 유리를 닦는 것은\n외로운 황홀한 심사이어니,\n고흔 폐혈관(肺血管)이 찢어진 채로\n아아, 늬는 산(山)새처럼 날아갔구나!","url":"https://www.google.com/search?q=%EC%A0%95%EC%A7%80%EC%9A%A9%20%EC%9C%A0%EB%A6%AC%EC%B0%BD%201%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p37","author":"정지용","title":"바다 1","tags":["잠시 쉬고 싶어요","마음이 복잡해요"],"rights":"full","fullText":"오·오·오·오·오· 소리치며 달려 가니\n오·오·오·오·오· 연달어서 몰아 온다.\n\n간 밤에 잠살포시\n머언 뇌성이 울더니,\n\n오늘 아침 바다는\n포도빛으로 부풀어젔다.\n\n철석, 처얼석, 철석, 처얼석, 철석,\n제비 날어 들듯 물결 새이새이로 춤을추어.","url":"https://www.google.com/search?q=%EC%A0%95%EC%A7%80%EC%9A%A9%20%EB%B0%94%EB%8B%A4%201%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p38","author":"정지용","title":"호수 1","tags":["짝사랑이 힘들어요","그리운 사람이 있어요"],"rights":"full","fullText":"얼굴 하나야\n손바닥 둘로\n폭 가리지만,\n\n보고싶은 마음\n호수만 하니\n눈 감을 밖에.","url":"https://www.google.com/search?q=%EC%A0%95%EC%A7%80%EC%9A%A9%20%ED%98%B8%EC%88%98%201%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p39","author":"정지용","title":"춘설","tags":["다시 시작하고 싶어요","천천히 성장하고 싶어요"],"rights":"full","fullText":"문 열자 선뜻!\n먼 산이 이마에 차라.\n\n우수절(雨水節) 들어\n바로 초하루 아침,\n\n세삼스레 눈이 덮인 멧부리와\n서늘옵고 빛난 이마받이 하다.\n\n얼음 금 가고 바람 새로 따르거니\n흰 옷고름 절로 향기로워라.\n\n웅숭거리고 살아난 양이\n아아 꿈 같기에 설어라.\n\n미나리 파릇한 새순 돋고\n옴짓 아니 기던 고기 입이 오물거리는,\n\n꽃 피기 전 철 아닌 눈에\n핫옷 벗고 도로 춥고 싶어라.","url":"https://www.google.com/search?q=%EC%A0%95%EC%A7%80%EC%9A%A9%20%EC%B6%98%EC%84%A4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p40","author":"김영랑","title":"모란이 피기까지는","tags":["노력이 헛된 것 같아요","이별을 받아들이기 어려워요"],"rights":"full","fullText":"모란이 피기까지는\n나는 아직 나의 봄을 기다리고 있을 테요\n모란이 뚝뚝 떨어져 버린 날\n나는 비로소 봄을 여읜 설움에 잠길 테요\n오월 어느 날 그 하루 무덥던 날\n떨어져 누운 꽃잎마저 시들어 버리고는\n천지에 모란은 자취도 없어지고\n뻗쳐 오르던 내 보람 서운케 무너졌느니\n모란이 지고 말면 그뿐 내 한 해는 다 가고 말아\n삼백예순 날 하냥 섭섭해 우옵네다\n모란이 피기까지는\n나는 아직 기다리고 있을 테요 찬란한 슬픔의 봄을","url":"https://www.google.com/search?q=%EA%B9%80%EC%98%81%EB%9E%91%20%EB%AA%A8%EB%9E%80%EC%9D%B4%20%ED%94%BC%EA%B8%B0%EA%B9%8C%EC%A7%80%EB%8A%94%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p41","author":"김영랑","title":"돌담에 속삭이는 햇발","tags":["잠시 쉬고 싶어요","위로가 필요해요"],"rights":"full","fullText":"돌담에 속삭이는 햇발같이\n풀 아래 웃음 짓는 샘물같이\n내 마음 고요히 고운 봄 길 위에\n오늘 하루 하늘을 우러르고 싶다\n\n새악시 볼에 떠 오는 부끄럼같이\n시의 가슴 살포시 젖는 물결같이\n보드레한 에메랄드 얇게 흐르는\n실비단 하늘을 바라보고 싶다\n","url":"https://www.google.com/search?q=%EA%B9%80%EC%98%81%EB%9E%91%20%EB%8F%8C%EB%8B%B4%EC%97%90%20%EC%86%8D%EC%82%AD%EC%9D%B4%EB%8A%94%20%ED%96%87%EB%B0%9C%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p42","author":"김영랑","title":"오월","tags":["다시 시작하고 싶어요","오늘을 잘 살고 싶어요"],"rights":"full","fullText":"들길은 마을에 들자 붉어지고\n마을 골목은 들로 내려서자 푸르러졌다.\n바람은 넘실 천(千) 이랑 만(萬) 이랑\n이랑 이랑 햇빛이 갈라지고\n보리도 허리통이 부끄럽게 드러났다.\n꾀꼬리는 엽태 혼자 날아 볼 줄 모르나니\n\n암컷이라 쫓길 뿐\n수놈이라 쫓을 뿐\n황금빛 난 길이 어지럴 뿐\n얇은 단장하고 아양 가득 차 있는\n산봉우리야 오늘밤 너 어디로 가 버리련?","url":"https://www.google.com/search?q=%EA%B9%80%EC%98%81%EB%9E%91%20%EC%98%A4%EC%9B%94%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p43","author":"김영랑","title":"내 마음을 아실 이","tags":["있는 그대로 인정받고 싶어요","짝사랑이 힘들어요"],"rights":"full","fullText":"내 마음을 아실 이\n내 혼자 마음 날같이 아실 이\n그래도 어데나 계실 것이면\n\n내 마음에 때때로 어리우는 티끌과\n속임 없는 눈물의 간곡한 방울방울\n푸른 밤 고이 맺는 이슬 같은 보람을\n보밴 듯 감추었다 내어드리지\n\n아! 그립다\n내 혼자 마음 날같이 아실 이\n꿈에나 아득히 보이는가\n\n향 맑은 옥돌에 불이 달아\n사랑은 타기도 하오련만\n불빛에 연긴 듯 희미론 마음은\n사랑도 모르리 내 혼자 마음은","url":"https://www.google.com/search?q=%EA%B9%80%EC%98%81%EB%9E%91%20%EB%82%B4%20%EB%A7%88%EC%9D%8C%EC%9D%84%20%EC%95%84%EC%8B%A4%20%EC%9D%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p44","author":"백석","title":"나와 나타샤와 흰 당나귀","tags":["짝사랑이 힘들어요","외로워요"],"rights":"full","fullText":"가난한 내가\n아름다운 나타샤를 사랑해서\n오늘밤은 푹푹 눈이 나린다\n\n나타샤를 사랑은 하고\n눈은 푹푹 날리고\n나는 혼자 쓸쓸히 앉어 소주를 마신다\n소주를 마시며 생각한다\n나타샤와 나는\n눈이 푹푹 쌓이는 밤 흰 당나귀 타고\n산골로 가자 출출이 우는 깊은 산골로 가 마가리에 살자\n\n눈은 푹푹 나리고\n나는 나타샤를 생각하고\n나타샤가 아니 올 리 없다\n언제 벌써 내 속에 고조곤히 와 이야기한다\n산골로 가는 것은 세상한테 지는 것이 아니다\n세상 같은 건 더러워 버리는 것이다\n\n눈은 푹푹 나리고\n아름다운 나타샤는 나를 사랑하고\n어데서 흰 당나귀도 오늘밤이 좋아서 응앙응앙 울을 것이다","url":"https://www.google.com/search?q=%EB%B0%B1%EC%84%9D%20%EB%82%98%EC%99%80%20%EB%82%98%ED%83%80%EC%83%A4%EC%99%80%20%ED%9D%B0%20%EB%8B%B9%EB%82%98%EA%B7%80%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p45","author":"백석","title":"흰 바람벽이 있어","tags":["내가 싫어요","외로워요"],"rights":"full","fullText":"오늘 저녁 이 좁다란 방의 흰 바람벽에\n어쩐지 쓸쓸한 것만이 오고 간다\n이 흰 바람벽에\n희미한 십오촉(十五燭) 전등이 지치운 불빛을 내어던지고\n때글은 다 낡은 무명샤쓰가 어두운 그림자를 쉬이고\n그리고 또 달디단 따끈한 감주나 한잔 먹고 싶다고 생각하는 내 가지가지 외로운 생각이 헤매인다\n그런데 이것은 또 어인 일인가\n이 흰 바람벽에\n내 가난한 늙은 어머니가 있다\n내 가난한 늙은 어머니가\n이렇게 시퍼러둥둥하니 추운 날인데 차디찬 물에 손은 담그고 무이며 배추를 씻고 있다.\n또 내 사랑하는 사람이 있다\n내 사랑하는 어여쁜 사람이\n어느 먼 앞대 조용한 개포가의 나즈막한 집에서\n그의 지아비와 마조 앉아 대구국을 끓여놓고 저녁을 먹는다\n벌써 어린것도 생겨서 옆에 끼고 저녁을 먹는다\n그런데 또 이즈막하야 어늬 사이엔가\n이 흰 바람벽엔\n내 쓸쓸한 얼굴을 쳐다보며\n이러한 글자들이 지나간다\n- 나는 이 세상에서 가난하고 외롭고 높고 쓸쓸하니 살어가도록 태어났다\n그리고 이 세상을 살어가는데\n내 가슴은 너무도 많이 뜨거운 것으로 호젓한 것으로 사랑으로 슬픔으로 가득 찬다\n그리고 이번에는 나를 위로하는 듯이 나를 울력하는 듯이\n눈질을 하며 주먹질을 하며 이런 글자들이 지나간다\n- 하늘이 이 세상을 내일 적에 그가 가장 귀해하고 사랑하는 것들은 모두\n가난하고 외롭고 높고 쓸쓸하니 그리고 언제나 넘치는 사랑과 슬픔 속에 살도록 만드신 것이다\n초생달과 바구지꽃과 짝새와 당나귀가 그러하듯이\n그리고 또 '프랑시쓰 쨈'과 도연명과 '라이넬 마리아 릴케'가 그러하듯이","url":"https://www.google.com/search?q=%EB%B0%B1%EC%84%9D%20%ED%9D%B0%20%EB%B0%94%EB%9E%8C%EB%B2%BD%EC%9D%B4%20%EC%9E%88%EC%96%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p46","author":"백석","title":"남신의주 유동 박시봉방","tags":["외로워요","다시 시작하고 싶어요"],"rights":"full","fullText":"어느 사이에 나는 아내도 없고, 또,\n아내와 같이 살던 집도 없어지고,\n그리고 살뜰한 부모며 동생들과도 멀리 떨어져서\n그 어느 바람 세인 쓸쓸한 거리 끝에 헤매이었다.\n바로 날도 저물어서,\n바람은 더욱 세게 불고, 추위는 점점 더해 오는데,\n나는 어느 목수(木手)네 집 헌 삿을 깐,\n한 방에 들어서 쥔을 붙이었다.\n이리하여 나는 이 습내 나는 춥고, 누긋한 방에서,\n낮이나 밤이나 나는 나 혼자도 너무 많은 것같이 생각하며,\n딜옹배기에 북덕불이라도 담겨 오면,\n이것을 안고 손을 쬐며 재 우에 뜻 없이 글자를 쓰기도 하며,\n또 문 밖에 나가지도 않구 자리에 누워서,\n머리에 손깍지 벼개를 하고 굴기도 하면서,\n나는 내 슬픔이며 어리석음이며를 소처럼 연하여 쌔김질하는 것이었다.\n내 가슴이 꽉 메어 올 적이며,\n내 눈에 뜨거운 것이 핑 괴일 적이며,\n또 내 스스로 화끈 낯이 붉도록 부끄러울 적이며,\n나는 내 슬픔과 어리석음에 눌리어 죽을 수밖에 없는 것을 느끼는 것이었다.\n그러나 잠시 뒤에 나는 고개를 들어,\n허연 문창을 바라보든가 또 눈을 떠서 높은 턴정을 쳐다보는 것인데,\n이때 나는 내 뜻이며 힘으로, 나를 이끌어 가는 것이 힘든 일인 것을 생각하고,\n이것들보다 더 크고, 높은 것이 있어서, 나를 마음대로 굴려 가는 것을 생각하는 것인데,\n이렇게 하여 여러 날이 지나는 동안에,\n내 어지러운 마음에는 슬픔이며, 한탄이며, 가라앉을 것은 차츰 앙금이 되어 가라앉고,\n외로운 생각만이 드는 때쯤 해서는,\n더러 나줏손에 쌀랑쌀랑 싸락눈이 와서 문창을 치기도 하는 때도 있는데,\n나는 이런 저녁에는 화로를 더욱 다가 끼며, 무릎을 꿇어보며,\n어니 먼 산 뒷옆에 바우 섶에 따로 외로이 서서,\n어두워 오는데 하이야니 눈을 맞을, 그 마른 잎새에는,\n쌀랑쌀랑 소리도 나며 눈을 맞을,\n그 드물다는 굳고 정한 갈매나무라는 나무를 생각하는 것이었다.","url":"https://www.google.com/search?q=%EB%B0%B1%EC%84%9D%20%EB%82%A8%EC%8B%A0%EC%9D%98%EC%A3%BC%20%EC%9C%A0%EB%8F%99%20%EB%B0%95%EC%8B%9C%EB%B4%89%EB%B0%A9%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p47","author":"백석","title":"여우난골족","tags":["집에서 외로워요","추억을 간직하고 싶어요"],"rights":"full","fullText":"명절날 나는 엄매 아배 따라 우리 집 개는 나를 따라 진할머니 진할아버지가 있는 큰집으로 가면\n\n얼굴에 별자국이 솜솜 난 말수와 같이 눈도 껌벅거리는 하루에 베 한 필을 짠다는 벌 하나 건너 집엔 복숭아나무가 많은 신리(新里) 고무 고무의 딸 이녀(李女) 작은 이녀\n\n열여섯에 사십이 넘은 홀아비의 후처가 된 포족족하니 성이 잘 나는 살빛이 매감탕 같은 입술과 젖꼭지는 더 까만 예수쟁이 마을 가까이 사는 토산(土山) 고무 고무의 딸 승녀(承女) 아들 승동이\n\n육십리(六十里)라고 해서 파랗게 뵈이는 산을 넘어 있다는 해변에서 과부가 된 코끝이 빨간 언제나 흰옷이 정하든 말끝에 설게 눈물을 짤 때가 많은 큰골 고무 고무의 딸 홍녀(洪女) 아들 홍동이 작은 홍동이\n\n배나무접을 잘 하는 주정을 하면 토방돌을 뽑는 오리치를 잘 놓는 먼 섬에 반디젓 담그러 가기를 좋아하는 삼춘 삼춘 엄매 사춘 누이 사춘 동생들\n\n이 그득히들 할머니 할아버지가 있는 안간에들 모여서 방안에서는 새 옷의 내음새가 나고\n\n또 인절미 송구떡 콩가루차떡의 내음새도 나고 끼때의 두부와 콩나물과 볶은 잔대와 고사리와 도야지비계는 모두 선득선득하니 찬 것들이다\n\n저녁술을 놓은 아이들은 외양간섶 밭마당에 달린 배나무 동산에서 쥐잡이를 하고 숨굴막질을 하고 꼬리잡이를 하고 가마타고 시집가는 놀음 말타고 장가가는 놀음을 하고 이렇게 밤이 어둡도록 북적하니 논다\n\n밤이 깊어가는 집안엔 엄매는 엄매들끼리 아르간에서들 웃고 이야기하고 아이들은 아이들끼리 웃간 한 방을 잡고 조아질하고 쌈방이 굴리고 바리깨돌림하고 호박떼기하고 제비손이구손이하고 이렇게 화디의 사기방등에 심지를 몇 번이나 돋우고 홍게닭이 몇 번이나 울어서 졸음이 오면 아릇목싸움 자리 싸움을 하며 히드득거리다 잠이 든다 그래서는 문창에 텅납새의 그림자가 치는 아츰 시누이 동세들이 육적하니 흥성거리는 부엌으론 샛문 틈으로 장지문 틈으로 무이징게 국을 끓이는 맛있는 내음새가 올라오도록 잔다","url":"https://www.google.com/search?q=%EB%B0%B1%EC%84%9D%20%EC%97%AC%EC%9A%B0%EB%82%9C%EA%B3%A8%EC%A1%B1%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p48","author":"백석","title":"수라","tags":["혼자인 것 같아요","친구에게 서운해요"],"rights":"full","fullText":"거미 새끼 하나 방바닥에 나린 것을 나는 아무 생각 없이 문밖으로 쓸어 버린다.\n\n차디찬 밤이다.\n\n\n어니젠가 새끼 거미 쓸려 나간 곳에 큰 거미가 왔다\n\n나는 가슴이 짜릿하다\n\n나는 또 큰 거미를 쓸어 문밖으로 버리며\n\n찬 밖이라도 새끼 있는 데로 가라고 하며 서러워한다\n\n\n이렇게 해서 아린 가슴이 싹기도 전이다.\n\n어데서 좁쌀알만 한 알에서 가제 깨인 듯한 발이 채 서지도 못한 무척 적은 새끼 거미가 이번엔 큰 거미 없어진 곳으로 와서 아물거린다\n\n나는 가슴이 메이는 듯하다\n\n내 손에 오르기라도 하라고 나는 손을 내어 미나 분명히 울고불고할 이 작은 것은 나를 무서우이 달어나 버리며 나를 서럽게 한다.\n\n나는 이 작은 것을 고 보드러운 종이에 받어 또 문밖으로 버리며\n\n이것의 엄마와 누나나 형이 가까이 이것의 걱정을 하여 있다가 쉬이 만나기나 했으면 좋으련만 하고 슬퍼한다.","url":"https://www.google.com/search?q=%EB%B0%B1%EC%84%9D%20%EC%88%98%EB%9D%BC%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p49","author":"박목월","title":"나그네","tags":["진로를 모르겠어요","선택이 두려워요"],"rights":"full","fullText":"강나루 건너서\n밀밭 길을\n\n구름에 달 가듯이\n가는 나그네\n\n길은 외줄기\n남도 삼백 리\n\n술 익는 마을마다\n타는 저녁놀\n\n구름에 달 가듯이\n가는 나그네","url":"https://www.google.com/search?q=%EB%B0%95%EB%AA%A9%EC%9B%94%20%EB%82%98%EA%B7%B8%EB%84%A4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p51","author":"박목월","title":"청노루","tags":["잠시 쉬고 싶어요","오늘을 잘 살고 싶어요"],"rights":"full","fullText":"머언 산(山) 청운사(靑雲寺)\n낡은 기와집\n\n산은 자하산(紫霞山)\n봄눈 녹으면\n\n느릅나무\n속잎 피어나는 열두 굽이를\n\n청(靑)노루\n맑은 눈에\n\n도는\n구름.","url":"https://www.google.com/search?q=%EB%B0%95%EB%AA%A9%EC%9B%94%20%EC%B2%AD%EB%85%B8%EB%A3%A8%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p52","author":"김춘수","title":"꽃","tags":["새 친구가 어려워요","있는 그대로 인정받고 싶어요"],"rights":"full","fullText":"내가 그의 이름을 불러주기 전에는\n그는 다만\n하나의 몸짓에 지나지 않았다.\n\n내가 그의 이름을 불러주었을 때,\n그는 나에게로 와서\n꽃이 되었다.\n\n내가 그의 이름을 불러준 것처럼\n나의 이 빛깔과 향기에 알맞은\n누가 나의 이름을 불러다오.\n그에게로 가서 나도\n그의 꽃이 되고 싶다.\n\n우리들은 모두\n무엇이 되고 싶다.\n너는 나에게 나는 너에게\n잊혀지지 않는 하나의 눈짓이 되고 싶다.","url":"https://www.google.com/search?q=%EA%B9%80%EC%B6%98%EC%88%98%20%EA%BD%83%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p53","author":"김춘수","title":"꽃을 위한 서시","tags":["있는 그대로 인정받고 싶어요","좋아하는 마음이 생겼어요"],"rights":"full","fullText":"나는 시방 위험한 짐승이다\n나의 손이 닿으면 너는\n미지의 까마득한 어둠이 된다\n\n존재의 흔들리는 가지 끝에서\n너는 이름도 없이\n피었다 진다\n\n눈시울이 젖어드는 이 무명의 어둠에\n추억의 한 접시 불을 밝히고\n나는 한 밤 내 운다\n\n나의 울음은 차츰 아닌 밤 돌개바람이 되어\n탑을 흔들다가\n돌에까지 스미면 금이 될 것이다\n\n...... 얼굴을 가리운 나의 신부여,","url":"https://www.google.com/search?q=%EA%B9%80%EC%B6%98%EC%88%98%20%EA%BD%83%EC%9D%84%20%EC%9C%84%ED%95%9C%20%EC%84%9C%EC%8B%9C%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p54","author":"정현종","title":"방문객","tags":["친구에게 서운해요","새 친구가 어려워요"],"rights":"full","fullText":"사람이 온다는 건실은 어마어마한 일이다.그는그의 과거와현재와그리고그의 미래와 함께 오기 때문이다.한 사람의 일생이 오기 때문이다.부서지기 쉬운그래서 부서지기도 했을마음이 오는 것이다---그 갈피를아마 바람은 더듬어볼 수 있을마음.내 마음이 그런 바람을 흉내낸다면필경 환대가 될 것이다.","url":"https://www.google.com/search?q=%EC%A0%95%ED%98%84%EC%A2%85%20%EB%B0%A9%EB%AC%B8%EA%B0%9D%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p55","author":"정현종","title":"섬","tags":["혼자인 것 같아요","새 친구가 어려워요"],"rights":"full","fullText":"사람들 사이에 섬이 있다\n그 섬에 가고 싶다","url":"https://www.google.com/search?q=%EC%A0%95%ED%98%84%EC%A2%85%20%EC%84%AC%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p56","author":"정현종","title":"떨어져도 튀는 공처럼","tags":["실패가 두려워요","성적이 떨어졌어요"],"rights":"full","fullText":"그래 살아봐야지\n너도 나도 공이 되어\n떨어져도 튀는 공이 되어\n\n살아봐야지\n쓰러지는 법이 없는 둥근\n공처럼, 탄력의 나라의\n왕자처럼\n\n가볍게 떠올라야지\n곧 움직일 준비 되어 있는 꼴\n둥근 공이 되어\n\n옳지 최선의 꼴\n지금의 네 모습처럼\n떨어져도 튀어 오르는 공\n쓰러지는 법이 없는 공이 되어.","url":"https://www.google.com/search?q=%EC%A0%95%ED%98%84%EC%A2%85%20%EB%96%A8%EC%96%B4%EC%A0%B8%EB%8F%84%20%ED%8A%80%EB%8A%94%20%EA%B3%B5%EC%B2%98%EB%9F%BC%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p57","author":"나태주","title":"풀꽃","tags":["내가 싫어요","자신감이 없어요","있는 그대로 인정받고 싶어요","외모가 신경 쓰여요","위로가 필요해요"],"rights":"full","fullText":"자세히 보아야\n예쁘다\n\n오래 보아야\n사랑스럽다\n\n너도 그렇다.","url":"https://www.google.com/search?q=%EB%82%98%ED%83%9C%EC%A3%BC%20%ED%92%80%EA%BD%83%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p58","author":"나태주","title":"너를 두고","tags":["친구에게 서운해요","좋아하는 마음이 생겼어요"],"rights":"full","fullText":"세상에 와서\n내가 하는 말 가운데서\n가장 고운 말을\n너에게 들려주고 싶다\n \n세상에 와서\n내가 가진 생각 가운데서\n가장 예쁜 생각을\n너에게 주고 싶다\n\n세상에 와서\n내가 할 수 있는 표정 가운데\n가장 좋은 표정을\n너에게 보이고 싶다\n\n이것이 내가 너를\n사랑하는 진정한 이유\n나 스스로 네 앞에서 가장\n좋은 사람이 되고 싶은 소망이다.","url":"https://www.google.com/search?q=%EB%82%98%ED%83%9C%EC%A3%BC%20%EB%84%88%EB%A5%BC%20%EB%91%90%EA%B3%A0%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p59","author":"나태주","title":"행복","tags":["잠시 쉬고 싶어요","오늘을 잘 살고 싶어요"],"rights":"full","fullText":"저녁 때\n돌아갈 집이 있다는 것\n\n힘들 때\n마음속으로 생각할 사람 있다는 것\n\n외로울 때\n혼자서 부를 노래 있다는 것.","url":"https://www.google.com/search?q=%EB%82%98%ED%83%9C%EC%A3%BC%20%ED%96%89%EB%B3%B5%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p60","author":"도종환","title":"담쟁이","tags":["노력이 헛된 것 같아요","용기가 필요해요"],"rights":"full","fullText":"저것은 벽\n어쩔 수 없는 벽이라고 우리가 느낄 때\n그때,\n담쟁이는 말없이 그 벽을 오른다.\n\n물 한 방울 없고, 씨앗 한 톨 살아남을 수 없는\n저것은 절망의 벽이라고 말할 때\n담쟁이는 서두르지 않고 앞으로 나아간다.\n\n한 뼘이라도 꼭 여럿이 함께 손을 잡고 올라간다.\n푸르게 절망을 다 덮을 때까지\n바로 그 절망을 잡고 놓지 않는다\n\n저것은 넘을 수 없는 벽이라고\n고개를 떨구고 있을 때\n담쟁이 잎 하나는\n담쟁이 잎 수천 개를 이끌고\n결국 그 벽을 넘는다.","url":"https://www.google.com/search?q=%EB%8F%84%EC%A2%85%ED%99%98%20%EB%8B%B4%EC%9F%81%EC%9D%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p61","author":"도종환","title":"흔들리며 피는 꽃","tags":["성적이 떨어졌어요","천천히 성장하고 싶어요"],"rights":"full","fullText":"흔들리지 않고 피는 꽃이 어디 있으랴 \n이 세상 그 어떤 아름다운 꽃들도\n다 흔들리면서 피었나니\n흔들리면서 줄기를 곧게 세웠나니\n흔들리지 않고 가는 사랑이 어디 있으랴 \n\n젖지 않고 피는 꽃이 어디 있으랴 \n이 세상 그 어떤 빛나는 꽃들도 \n다 젖으며 젖으며 피었나니\n바람과 비에 젖으며 꽃잎 따뜻하게 피웠나니\n젖지 않고 가는 삶이 어디 있으랴","url":"https://www.google.com/search?q=%EB%8F%84%EC%A2%85%ED%99%98%20%ED%9D%94%EB%93%A4%EB%A6%AC%EB%A9%B0%20%ED%94%BC%EB%8A%94%20%EA%BD%83%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p62","author":"도종환","title":"접시꽃 당신","tags":["위로가 필요해요","그리운 사람이 있어요"],"rights":"full","fullText":"옥수수잎에 빗방울이 나립니다\n오늘도 또 하루를 살았습니다\n낙엽이 지고 찬 바람이 부는 때까지\n우리에게 남아 있는 날들은\n참으로 짧습니다\n아침이면 머릿맡에 흔적 없이 빠진 머리칼이 쌓이듯\n생명은 당신의 몸을 우수수 빠져나갑니다\n씨앗도 열매로 크기엔\n아직 많은 날을 기다려야 하고\n당신과 내가 갈아엎어야 할\n저 많은 묵정밭은 그대로 남았는데\n논두렁을 덮은 망촛대와 잡풀 가에\n넋을 놓고 한참을 앉았다 일어섭니다\n마음 놓고 큰 약 한번 써보기를 주저하며\n남루한 살림의 한 구석을 같이 꾸려오는 동안\n당신은 벌레 한 마리 함부로 죽일 줄 모르고\n악한 얼굴 한 번 짖지 않으며 살려했습니다 \n그러나 당신과 내가 받아 들여야 할\n남은 하루하루 하늘은\n끝없이 밀려오는 가득한 먹장구름입니다\n\n처음엔 접시꽃 같은 당신을 생각하며\n무너지는 담벼락을 껴안은 듯\n주체할 수 없는 신열로 떨려왔습니다\n그러나 이것이 우리에게 최선의 삶을\n살아온 날처럼, 부끄럼 없이 살아가야 한다는 \n마지막 말씀으로 받아들여야 함을 압니다\n우리가 버리지 못했던\n보잘것없는 눈 높음과 영욕까지도\n이제는 스스럼없이 버리고\n내 마음의 모두를 더욱 아리고 슬픈 사람에게\n줄 수 있는 날들이 짧아진 것을 아파해야 합니다\n남은 날은 참으로 짧지만\n남겨진 하루하루를 마지막 날인 듯 살 수 있는 길은\n우리가 곪고 썩은 상처 가운데에\n있는 힘을 다해 맞서는 길입니다\n보다 더 큰 아픔을 껴안고 죽어가는 사람들이\n우리 주위엔 얼마나 많은데\n나 하나 육신의 절망과 질병으로 쓰러져야 하는 것이\n가슴 아픈 일임을 생각해야 합니다\n\n콩댐한 장판같이 바래어 가는 노랑꽃 핀 얼굴 보며\n이것이 차마 입에 떠올릴 수 있는 말은 아니지만\n하지만 성한 몸뚱아리 어느 곳 있다면\n그것조차 끼워 넣어야 살아갈 수 있는 사람에게\n뿌듯이 주고 갑시다\n기꺼이 살의 어느 부분도 떼어 주고 가는 삶을\n나도 살다 가고 싶습니다\n옥수수잎을 때리는 빗소리가 굵어집니다\n이제 또 한 번의 저무는 밤을 지우지만\n이 어둠이 다하고 새로운 새벽이 오는 순간까지\n나는 당신의 손을 잡고 당신 곁에 영원히 있습니다","url":"https://www.google.com/search?q=%EB%8F%84%EC%A2%85%ED%99%98%20%EC%A0%91%EC%8B%9C%EA%BD%83%20%EB%8B%B9%EC%8B%A0%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p63","author":"정호승","title":"수선화에게","tags":["혼자인 것 같아요","내가 싫어요","헤어짐이 슬퍼요","외로워요"],"rights":"full","fullText":"울지 마라.\n외로우니까 사람이다.\n살아간다는 것은 외로움을 견디는 일이다.\n공연히 오지 않는 전화를 기다리지 마라.\n눈이 오면 눈길을 걸어가고\n비가 오면 빗길을 걸어가라.\n갈대숲에서 가슴검은도요새도 너를 보고 있다.\n가끔은 하느님도 외로워서 눈물을 흘리신다.\n새들이 나뭇가지에 앉아 있는 것도 외로움 때문이고\n네가 물가에 앉아 있는 것도 외로움 때문이다.\n산 그림자도 외로워서 하루에 한 번씩 마을로 내려온다.\n종소리도 외로워서 울려 퍼진다.","url":"https://www.google.com/search?q=%EC%A0%95%ED%98%B8%EC%8A%B9%20%EC%88%98%EC%84%A0%ED%99%94%EC%97%90%EA%B2%8C%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p64","author":"정호승","title":"슬픔이 기쁨에게","tags":["친구에게 서운해요","상처 주는 말이 힘들어요"],"rights":"full","fullText":"나는 이제 너에게도 슬픔을 주겠다.\n사랑보다 소중한 슬픔을 주겠다.\n겨울밤 거리에서 귤 몇 개 놓고\n살아온 추위와 떨고 있는 할머니에게\n귤값을 깎으면서 기뻐하던 너를 위하여\n나는 슬픔의 평등한 얼굴을 보여 주겠다.\n내가 어둠 속에서 너를 부를 때\n단 한 번도 평등하게 웃어 주질 않은\n가마니에 덮인 동사자가 다시 얼어 죽을 때\n가마니 한 장조차 덮어 주지 않은\n무관심한 너의 사랑을 위해\n흘릴 줄 모르는 너의 눈물을 위해\n나는 이제 너에게도 기다림을 주겠다.\n이 세상에 내리던 함박눈을 멈추겠다.\n보리밭에 내리던 봄눈들을 데리고\n추워 떠는 사람들의 슬픔에게 다녀와서\n눈 그친 눈길을 너와 함께 걷겠다.\n슬픔의 힘에 대한 이야기를 하며\n기다림의 슬픔까지 걸어가겠다.","url":"https://www.google.com/search?q=%EC%A0%95%ED%98%B8%EC%8A%B9%20%EC%8A%AC%ED%94%94%EC%9D%B4%20%EA%B8%B0%EC%81%A8%EC%97%90%EA%B2%8C%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p65","author":"정호승","title":"봄길","tags":["다시 시작하고 싶어요","용기가 필요해요"],"rights":"full","fullText":"길이 끝나는 곳에서도\n길이 있다\n길이 끝나는 곳에서도\n길이 되는 사람이 있다\n스스로 봄길이 되어\n끝없이 걸어가는 사람이 있다\n강물은 흐르다가 멈추고\n새들은 날아가 돌아오지 않고\n하늘과 땅 사이의 모든 꽃잎은 흩어져도\n보라\n사랑이 끝난 곳에서도\n사랑으로 남아 있는 사람이 있다\n스스로 사랑이 되어\n한없이 봄길을 걸어가는 사람이 있다","url":"https://www.google.com/search?q=%EC%A0%95%ED%98%B8%EC%8A%B9%20%EB%B4%84%EA%B8%B8%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p66","author":"정호승","title":"내가 사랑하는 사람","tags":["있는 그대로 인정받고 싶어요","좋아하는 마음이 생겼어요"],"rights":"full","fullText":"나는 그늘이 없는 사람을 사랑하지 않는다\n나는 그늘을 사랑하지 않는 사람을 사랑하지 않는다\n나는 한 그루 나무의 그늘이 된 사람을 사랑한다\n햇빛도 그늘이 있어야 맑고 눈부시다\n나무 그늘에 앉아\n나뭇잎 사이로 반짝이는 햇살을 바라보면\n세상은 그 얼마나 아름다운가\n나는 눈물이 없는 사람을 사랑하지 않는다\n나는 눈물을 사랑하지 않는 사람을 사랑하지 않는다\n나는 한 방울 눈물이 된 사람을 사랑한다\n기쁨도 눈물이 없으면 기쁨이 아니다\n사랑도 눈물 없는 사랑이 어디 있는가\n나무 그늘에 앉아\n다른 사람의 눈물을 닦아주는 사람의 모습은\n그 얼마나 고요한 아름다움인가","url":"https://www.google.com/search?q=%EC%A0%95%ED%98%B8%EC%8A%B9%20%EB%82%B4%EA%B0%80%20%EC%82%AC%EB%9E%91%ED%95%98%EB%8A%94%20%EC%82%AC%EB%9E%8C%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p67","author":"김용택","title":"달이 떴다고 전화를 주시다니요","tags":["친구에게 서운해요","좋아하는 마음이 생겼어요"],"rights":"full","fullText":"달이 떴다고 전화를 주시다니요\n이 밤 너무 신나고 근사해요\n내 마음에도 생전 처음 보는\n환한 달이 떠오르고\n산 아래 작은 마을이 그려집니다\n간절한 이 그리움들을\n사무쳐 오는 이 열정들을\n달빛에 실어\n당신께 보냅니다\n\n세상에,\n강변에 달빛이 곱다고\n전화를 다 주시다니요\n흐르는 물 어디쯤 눈부시게 부서지는 소리\n문득 들려옵니다.","url":"https://www.google.com/search?q=%EA%B9%80%EC%9A%A9%ED%83%9D%20%EB%8B%AC%EC%9D%B4%20%EB%96%B4%EB%8B%A4%EA%B3%A0%20%EC%A0%84%ED%99%94%EB%A5%BC%20%EC%A3%BC%EC%8B%9C%EB%8B%A4%EB%8B%88%EC%9A%94%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p68","author":"김용택","title":"섬진강 1","tags":["노력이 헛된 것 같아요","천천히 성장하고 싶어요"],"rights":"full","fullText":"가문 섬진강을 따라가며 보라 \n퍼가도 퍼가도 전라도 실핏줄 같은 \n개울물들이 끊기지 않고 모여 흐르며 \n해 저물면 저무는 강변에 \n숯불 같은 자운영꽃 머리에 이어주며 \n지도에도 없는 동네 강변 \n식물도감에도 없는 뜰에 \n어둠을 끌어다 죽이며 \n그을린 이마 훤하게 \n꽃등도 달아준다 \n흐르다 흐르다 목메이면 \n영산강으로 가는 물줄기를 불러 \n뼈 으스러지게 그리워 얼싸안고 \n지리산 뭉툭한 허리를 감고 돌아가는 \n섬진강을 따라가며 보라 \n섬진강물이 어디 몇 놈이 달려들어 \n퍼낸다고 마를 강물이더냐고 \n지리산이 저문 강물에 얼굴을 씻고 \n일어서서 껄껄 웃으며 \n무등산을 보며 그렇지 않느냐고 물어보면 \n노을 띈 무등산이 그렇다고 훤한 이마 끄덕이는 \n고갯짓을 바라보며 \n저무는 섬진강을 따라가며 보자 \n어디 몇몇 애비 없는 후레자식들이 \n퍼간다고 마를 강물인가를","url":"https://www.google.com/search?q=%EA%B9%80%EC%9A%A9%ED%83%9D%20%EC%84%AC%EC%A7%84%EA%B0%95%201%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p69","author":"안도현","title":"너에게 묻는다","tags":["상처 주는 말이 힘들어요","있는 그대로 인정받고 싶어요"],"rights":"full","fullText":"연탄재 함부로 발로 차지 마라\n너는\n누구에게 한번이라도 뜨거운 사람이었느냐","url":"https://www.google.com/search?q=%EC%95%88%EB%8F%84%ED%98%84%20%EB%84%88%EC%97%90%EA%B2%8C%20%EB%AC%BB%EB%8A%94%EB%8B%A4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p70","author":"안도현","title":"연어","tags":["진로를 모르겠어요","선택이 두려워요"],"rights":"full","fullText":"우리 연어들이 알을 낳는 게 중요하다는 것은 나도 알아. 하지만 알을 낳고 못 낳고가 아니라 얼마나 건강하고 좋은 알을 낳는가 하는 것도 중요하다고 생각해. 우리가 쉬운 길을 택하기 시작하면 우리의 새끼들도 쉬운 길로만 가려고 할 것이고, 곧 거기에 익숙해지고 말 거야. 그러나 우리가 폭포를 뛰어넘는다면, 그 뛰어넘는 순간의 고통과 환희를 훗날 알을 깨고 나올 우리 새끼들에게 고스란히 넘겨 주게 되지 않을까? 우리들이 지금 여기서 보내고 있는 한순간, 한순간이 먼 훗날 우리 새끼들의 뼈와 살이 되고 옹골진 삶이 되는 건 아닐까? 우리가 쉬운 길 대신에 폭포라는 어려운 길을 선택해야 하는 이유는 그것뿐이야.","url":"https://www.google.com/search?q=%EC%95%88%EB%8F%84%ED%98%84%20%EC%97%B0%EC%96%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p71","author":"안도현","title":"우리가 눈발이라면","tags":["진로를 모르겠어요","친구와 다퉜어요","마음이 복잡해요","위로가 필요해요"],"rights":"full","fullText":"우리가 눈발이라면\n허공에서 쭈빗쭈빗 흩날리는\n진눈깨비는 되지 말자\n세상이 바람 불고 춥고 어둡다 해도\n사람이 사는 마을\n가장 낮은 곳으로\n따뜻한 함박눈이 되어 내리자\n우리가 눈발이라면\n잠 못 든 이의 창문가에서는\n편지가 되고\n그이의 깊고 붉은 상처 위에 돋는\n새 살이 되자","url":"https://www.google.com/search?q=%EC%95%88%EB%8F%84%ED%98%84%20%EC%9A%B0%EB%A6%AC%EA%B0%80%20%EB%88%88%EB%B0%9C%EC%9D%B4%EB%9D%BC%EB%A9%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p72","author":"이해인","title":"민들레의 영토","tags":["자신감이 없어요","용기가 필요해요"],"rights":"full","fullText":"기도는 나의 음악\n가슴 한복판에 꽂아 놓은\n사랑은 단 하나의\n성스러운 깃발\n\n태초부터 나의 영토는\n좁은 길이었다 해도\n고독의 진주를 캐며\n내가\n꽃으로 피어나야 할 땅\n\n애처로이 쳐다보는\n인정의 고움도\n나는 싫어\n\n바람이 스쳐가며\n노래를 하면\n푸른 하늘에게\n피리를 불었지\n\n태양에 쫓기어\n활활 타다 남은 저녁노을에\n저렇게 긴 강이 흐른다\n\n노오란 내 가슴이\n하얗게 여위기 전\n그이는 오실까\n\n당신의 맑은 눈물\n내 땅에 떨어지면\n바람에 날려 보낼\n기쁨의 꽃씨\n\n흐려오는\n세월의 눈시울에\n원색의 아픔을 씹는\n내 조용한 숨소리\n\n보고 싶은 얼굴이여","url":"https://www.google.com/search?q=%EC%9D%B4%ED%95%B4%EC%9D%B8%20%EB%AF%BC%EB%93%A4%EB%A0%88%EC%9D%98%20%EC%98%81%ED%86%A0%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p73","author":"이해인","title":"봄 일기","tags":["다시 시작하고 싶어요","오늘을 잘 살고 싶어요"],"rights":"full","fullText":"봄에도 바람의 맛은 매일 다르듯이\n매일을 사는 내 마음 빛도\n조금씩 다르지만\n쉼 없이 노래했었지\n\n쑥처럼 흔하게 돋아나는\n일상의 근심 중에도\n희망의 향기로운 들꽃이\n마음속에 숨어 피는 기쁨을\n\n언제나 신선한 설레임으로\n사랑하는 이를 맞듯이\n매일의 문을 열면\n안으로 조용히 비치 터지는 소리\n봄을 살기 위하여\n내가 열리는 소리","url":"https://www.google.com/search?q=%EC%9D%B4%ED%95%B4%EC%9D%B8%20%EB%B4%84%20%EC%9D%BC%EA%B8%B0%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p74","author":"고은","title":"그 꽃","tags":["진로를 모르겠어요","꿈이 자꾸 바뀌어요","남과 비교해요","성적이 떨어졌어요","노력이 헛된 것 같아요","마음이 복잡해요","위로가 필요해요","천천히 성장하고 싶어요","오늘을 잘 살고 싶어요"],"rights":"full","fullText":"내려갈 때 보았네\n올라갈 때 보지 못한\n그 꽃","url":"https://www.google.com/search?q=%EA%B3%A0%EC%9D%80%20%EA%B7%B8%20%EA%BD%83%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p75","author":"신경림","title":"농무","tags":["공부할 의욕이 없어요","노력이 헛된 것 같아요","아무것도 하기 싫어요"],"rights":"full","fullText":"징이 울린다 막이 내렸다\n오동나무에 전등이 매어달린 가설 무대\n구경꾼이 돌아가고 난 텅 빈 운동장\n우리는 분이 얼룩진 얼굴로\n학교 앞 소줏집에 몰려 술을 마신다\n답답하고 고달프게 사는 것이 원통하다\n꽹과리를 앞장세워 장거리로 나서면\n따라붙어 악을 쓰는 쪼무래기들뿐\n처녀애들은 기름집 담벼락에 붙어 서서\n철없이 킬킬대는구나\n보름달은 밝아 어떤 녀석은\n꺽정이처럼 울부짖고 또 어떤 녀석은\n서림이처럼 해해대지만 이까짓\n산구석에 처박혀 발버둥친들 무엇하랴\n비료값도 안 나오는 농사 따위야\n아예 여편네에게나 맡겨 두고\n쇠전을 거쳐 도수장 앞에 와 돌 때\n우리는 점점 신명이 난다\n한 다리를 들고 날라리를 불거나\n고갯짓을 하고 어깨를 흔들거나","url":"https://www.google.com/search?q=%EC%8B%A0%EA%B2%BD%EB%A6%BC%20%EB%86%8D%EB%AC%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p76","author":"신경림","title":"갈대","tags":["내가 싫어요","마음이 불안해요","외로워요","위로가 필요해요"],"rights":"full","fullText":"언제부턴가 갈대는 속으로\n조용히 울고 있었다.\n\n그런 어느 밤이었을 것이다. 갈대는\n그의 온몸이 흔들리고 있는 것을 알았다.\n\n바람도 달빛도 아닌 것.\n갈대는 저를 흔드는 것이 제 조용한 울음인 것을\n까맣게 몰랐다.\n\n― 산다는 것은 속으로 이렇게\n조용히 울고 있는 것이란 것을 그는 몰랐다.","url":"https://www.google.com/search?q=%EC%8B%A0%EA%B2%BD%EB%A6%BC%20%EA%B0%88%EB%8C%80%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p77","author":"신경림","title":"가난한 사랑 노래","tags":["기대가 부담스러워요","짝사랑이 힘들어요"],"rights":"full","fullText":"가난하다고 해서 외로움을 모르겠는가\n너와 헤어져 돌아오는\n눈 쌓인 골목길에 새파랗게 달빛이 쏟아지는데.\n가난하다고 해서 두려움이 없겠는가\n두 점을 치는 소리\n방범대원의 호각 소리 메밀묵 사려 소리에\n눈을 뜨면 멀리 육중한 기계 굴러가는 소리.\n가난하다고 해서 그리움을 버렸겠는가\n어머님 보고 싶소 수없이 뇌어 보지만,\n집 뒤 감나무에 까치밥으로 하나 남았을\n새빨간 감 바람 소리도 그려 보지만.\n가난하다고 해서 사랑을 모르겠는가\n내 볼에 와 닿던 네 입술의 뜨거움\n사랑한다고 사랑한다고 속삭이던 네 숨결\n돌아서는 내 등 뒤에 터지던 네 울음.\n가난하다고 해서 왜 모르겠는가,\n가난하기 때문에 이것들을\n이 모든 것들을 버려야 한다는 것을.","url":"https://www.google.com/search?q=%EC%8B%A0%EA%B2%BD%EB%A6%BC%20%EA%B0%80%EB%82%9C%ED%95%9C%20%EC%82%AC%EB%9E%91%20%EB%85%B8%EB%9E%98%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p78","author":"기형도","title":"엄마 걱정","tags":["집에서 외로워요","그리운 사람이 있어요"],"rights":"full","fullText":"열무 삼십 단을 이고\n시장에 간 우리 엄마\n안 오시네, 해는 시든 지 오래\n나는 찬밥처럼 방에 담겨\n아무리 천천히 숙제를 해도\n엄마 안 오시네, 배춧잎 같은 발소리 타박타박\n안 들리네, 어둡고 무서워\n금간 창 틈으로 고요히 빗소리\n빈 방에 혼자 엎드려 훌쩍거리던\n\n아주 먼 옛날\n지금도 내 눈시울을 뜨겁게 하는\n그 시절, 내 유년의 윗목","url":"https://www.google.com/search?q=%EA%B8%B0%ED%98%95%EB%8F%84%20%EC%97%84%EB%A7%88%20%EA%B1%B1%EC%A0%95%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p79","author":"기형도","title":"질투는 나의 힘","tags":["남과 비교해요","내가 싫어요"],"rights":"full","fullText":"아주 오랜 세월이 흐른 뒤에\n힘없는 책갈피는 이 종이를 떨어뜨리리\n그때 내 마음은 너무나 많은 공장을 세웠으니\n어리석게도 그토록 기록할 것이 많았구나\n구름 밑을 천천히 쏘다니는 개처럼\n지칠 줄 모르고 공중에서 머뭇거렸구나\n나 가진 것 탄식밖에 없어\n저녁 거리마다 물끄러미 청춘을 세워두고\n살아온 날들을 신기하게 세어보았으니\n그 누구도 나를 두려워하지 않았으니\n내 희망의 내용은 질투뿐이었구나\n그리하여 나는 우선 여기에 짧은 글을 남겨둔다\n나의 생은 미친 듯이 사랑을 찾아 헤매었으나\n단 한 번도 스스로를 사랑하지 않았노라","url":"https://www.google.com/search?q=%EA%B8%B0%ED%98%95%EB%8F%84%20%EC%A7%88%ED%88%AC%EB%8A%94%20%EB%82%98%EC%9D%98%20%ED%9E%98%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p80","author":"기형도","title":"빈집","tags":["헤어짐이 슬퍼요","외로워요"],"rights":"full","fullText":"사랑을 잃고 나는 쓰네\n\n잘 있거라, 짧았던 밤들아\n창밖을 떠돌던 겨울 안개들아\n아무것도 모르던 촛불들아, 잘 있거라\n공포를 기다리던 흰 종이들아\n망설임을 대신하던 눈물들아\n잘 있거라, 더 이상 내 것이 아닌 열망들아\n\n장님처럼 나 이제 더듬거리며 문을 잠그네\n가엾은 내 사랑 빈집에 갇혔네","url":"https://www.google.com/search?q=%EA%B8%B0%ED%98%95%EB%8F%84%20%EB%B9%88%EC%A7%91%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p81","author":"이문재","title":"농담","tags":["친구와 다퉜어요","상처 주는 말이 힘들어요"],"rights":"full","fullText":"문득 아름다운 것과 마주쳤을 때\n지금 곁에 있으면 얼마나 좋을까, 하고\n떠오르는 얼굴이 있다면 그대는\n사랑하고 있는 것이다.\n그윽한 풍경이나\n제대로 맛을 낸 음식 앞에서\n아무도 생각하지 않는 사람\n그 사람은 정말 강하거나\n아니면 진짜 외로운 사람이다.\n\n종소리를 더 멀리 내보내기 위하여\n종은 더 아파야 한다.","url":"https://www.google.com/search?q=%EC%9D%B4%EB%AC%B8%EC%9E%AC%20%EB%86%8D%EB%8B%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p82","author":"문태준","title":"가재미","tags":["위로가 필요해요","그리운 사람이 있어요"],"rights":"full","fullText":"김천의료원 6인실 302호에 산소마스크를 쓰고 암투병중인 그녀가 누워있다.\n바닥에 바짝 엎드린 가재미처럼 그녀가 누워있다.\n나는 그녀의 옆에 나란히 한 마리 가재미로 눕는다.\n가재미가 가재미에게 눈길을 넌네자 그녀가 울컥 눈물을 쏟아낸다.\n한쪽 눈이 다른 한쪽 눈으로 옮겨 붙은 야윈 그녀가 운다.\n그녀는 죽음만을 보고 있고 나는 그녀가 살아 온 파랑같은 날들을 보고 있다.\n좌우를 흔들며 살던 그녀의 물 속 삶을 나는 떠올린다.\n그녀의 오솔길이며 그 길에 돋아나던 대낮의 뻐꾸기 소리며\n가늘은 국수를 삶던 저녁이며 흙담조차 없었던 그녀 누대의 가계를 떠올린다.\n두 다리는 서서히 멀어져 가랑이지고\n폭설을 견디지 못하는 나뭇가지처럼 등뼈가 구부정해지던 그 겨울 어느날을 생각한다.\n그녀의 숨소리가 느릅나무 껍질처럼 점점 거칠어진다.\n나는 그녀가 죽음 바깥의 세상을 이제 볼 수 없다는 것을 안다.\n한쪽 눈이 다른 쪽 눈으로 캄캄하게 쏠려버렸다는 것을 안다.\n나는 다만 좌우를 흔들며 헤엄쳐 가 그녀의 물 속에 나란히 눕는다.\n산소호흡기로 들어마신 물을 마른 내 몸위에 그녀가 가만히 적셔준다.","url":"https://www.google.com/search?q=%EB%AC%B8%ED%83%9C%EC%A4%80%20%EA%B0%80%EC%9E%AC%EB%AF%B8%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p83","author":"김기택","title":"멸치","tags":["노력이 헛된 것 같아요","기대가 부담스러워요"],"rights":"full","fullText":"굳어지기 전까지 저 딱딱한 것들은 물결이었다\n파도와 해일이 쉬고 있는 바닷속\n지느러미의 물결 사이에 끼어\n유유히 흘러 다니던 무수한 갈래의 길이었다\n그물이 물결 속에서 멸치들을 떼어냈던 것이다\n햇빛의 꼿꼿한 직선들 틈에 끼이자마자\n부드러운 물결은 팔딱거리다 길을 잃었을 것이다\n바람과 햇볕이 달라붙어 물기를 빨아들이는 동안\n바다의 무늬는 뼈다귀처럼 남아\n멸치의 등과 지느러미 위에서 딱딱하게 굳어갔던 것이다\n모래 더미처럼 길거리에 쌓이고\n건어물집의 푸석한 공기에 풀리다가\n기름에 튀겨지고 접시에 담겨졌던 것이다\n지금 젓가락 끝에 깍두기처럼 딱딱하게 집히는 이 멸치에는\n두껍고 뻣뻣한 공기를 뚫고 흘러가는\n바다가 있다 그 바다에는 아직도\n지느러미가 있고 지느러미를 흔드는 물결이 있다\n이 작은 물결이\n지금도 멸치의 몸통을 뒤틀고 있는 이 작은 무늬가\n파도를 만들고 해일을 부르고\n고깃배를 부수고 그물을 찢었던 것이다","url":"https://www.google.com/search?q=%EA%B9%80%EA%B8%B0%ED%83%9D%20%EB%A9%B8%EC%B9%98%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p84","author":"최승호","title":"대설주의보","tags":["마음이 불안해요","앞일이 걱정돼요"],"rights":"full","fullText":"해일처럼 굽이치는 백색의 산들,\n제설차 한 대 올 리 없는\n깊은 백색의 골짜기를 메우며\n굵은 눈발은 휘몰아치고,\n쪼그마한 숯덩이만한 게 짧은 날개를 파닥이며……\n굴뚝새가 눈보라 속으로 날아간다.\n\n길 잃은 등산객들 있을 듯\n외딴 두메마을 길 끊어 놓을 듯\n은하수가 펑펑 쏟아져 날아오는 덤벼드는 눈,\n다투어 몰려오는 힘찬 눈보라의 군단,\n눈보라가 내리는 백색의 계엄령.\n\n쪼그마한 숯덩이만한 게 짧은 날개를 파닥이며……\n날아온다 꺼칠한 굴뚝새가\n서둘러 뒷간에 몸을 감춘다.\n그 어디에 부리부리한 솔개라도 도사리고 있다는 것일까.\n\n길 잃고 굶주리는 산짐승들 있을 듯\n눈더미의 무게로 소나무 가지들이 부러질 듯\n다투어 몰려오는 힘찬 눈보라의 군단,\n때죽나무와 때 끓이는 외딴집 굴뚝에\n해일처럼 굽이치는 백색의 산과 골짜기에\n눈보라가 내리는\n백색의 계엄령.​","url":"https://www.google.com/search?q=%EC%B5%9C%EC%8A%B9%ED%98%B8%20%EB%8C%80%EC%84%A4%EC%A3%BC%EC%9D%98%EB%B3%B4%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p85","author":"함민복","title":"긍정적인 밥","tags":["노력이 헛된 것 같아요","오늘을 잘 살고 싶어요"],"rights":"full","fullText":" 시(詩) 한 편에 삼만 원이면\n 너무 박하다 싶다가도\n 쌀이 두 말인데 생각하면\n 금방 마음이 따뜻한 밥이 되네\n\n 시집 한 권에 삼천 원이면\n 든 공에 비해 헐하다 싶다가도\n 국밥이 한 그릇인데\n 내 시집이 국밥 한 그릇만큼\n 사람들 가슴을 따뜻하게 덮여줄 수 있을까\n 생각하면 아직 멀기만 하네\n\n 시집이 한 권 팔리면\n 내게 삼백 원이 돌아온다\n 박리다 싶다가도\n 굵은 소금이 한 됫박인데 생각하면\n 푸른 바다처럼 상할 마음 하나 없네 ","url":"https://www.google.com/search?q=%ED%95%A8%EB%AF%BC%EB%B3%B5%20%EA%B8%8D%EC%A0%95%EC%A0%81%EC%9D%B8%20%EB%B0%A5%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""},{"id":"p86","author":"함민복","title":"눈물은 왜 짠가","tags":["부모님과 갈등이 있어요","그리운 사람이 있어요"],"rights":"full","fullText":"   지난 여름이었습니다. 가세가 기울어 갈 곳이 없어진 어머니를 고향 이모님 댁에 모셔다드릴 때의 일입니다. 어머니는 차 시간도 있고 하니까 요기를 하고 가자시며 고깃국을 먹으러 가자고 하셨습니다. 어머니는 한평생 중이염*을 앓아 고기만 드시면 귀에서 고름이 나오곤 했습니다. 그런 어머니가 나를 위해 고깃국을 먹으러 가자고 하시는 마음을 읽자 어머니의 주름살이 더 깊게 보였습니다. 설렁탕집에 들어가 물수건으로 이마에 흐르는 땀을 닦았습니다.\n\n   \"더울 때일수록 고기를 먹어야 더위를 안 먹는다. 고기를 먹어야 하는데……고깃국물이라도 되게 먹어둬라.\"\n\n   설렁탕에 다대기*를 풀어 한 댓 숟가락 국물을 떠먹었을 때였습니다. 어머니가 주인아저씨를 불렀습니다. 주인아저씨는 뭐 잘못된 게 있나 싶었던지 고개를 앞으로 빼고 의아해하며 다가왔습니다. 어머니는 설렁탕에 소금을 너무 많이 풀어 짜서 그런다며 국물을 더 달라고 했습니다. 주인아저씨는 흔쾌히 국물을 더 갖다주었습니다. 어머니는 주인아저씨가 안 보고 있다 싶어지자 내 투가리*에 국물을 부어주셨습니다. 나는 당황하여 주인아저씨를 흘끔거리며* 국물을 더 받았습니다. 주인아저씨는 넌지시 우리 모자의 행동을 보고 애써 시선을 외면해 주는 게 역력했습니다.\n\n   나는 국물을 그만 따르라고 내 투가리로 어머니 투가리를 툭, 부딪혔습니다. 순간 투가리가 부딪히며 내는 소리가 왜 그렇게 서럽게 들리던지 나는 울컥 치받치는 감정을 억제하려고 설렁탕에 만 밥과 깍두기를 마구 씹어댔습니다. 그러자 주인아저씨는 우리 모자가 미안한 마음을 안 느끼게 조심, 다가와 성냥갑만 한 깍두기를 놓고 돌아서는 거였습니다. 일순, 나는 참고 있던 눈물을 찔끔 흘리고 말았습니다. 나는 얼른 이마에 흐른 땀을 훔쳐내려 눈물을 땀인 양 만들어놓고 나서, 아주 천천히 물수건으로 눈동자에서 난 땀을 씻어냈습니다. 그러면서 속으로 중얼거렸습니다.\n\n   눈물은 왜 짠가.","url":"https://www.google.com/search?q=%ED%95%A8%EB%AF%BC%EB%B3%B5%20%EB%88%88%EB%AC%BC%EC%9D%80%20%EC%99%9C%20%EC%A7%A0%EA%B0%80%20%EC%8B%9C%20%EC%9B%90%EB%AC%B8","note":"","questions":""}]}</script><script>const catalog=JSON.parse(document.getElementById('seed').textContent);
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validUrl=s=>{try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const catFor=t=>Object.entries(catalog.categories).find(([k,v])=>v.includes(t))?.[0]||'';
let category='', concern='', search='';
function renderFilters(){let root=$('filters');root.innerHTML='<button class="chip '+(!category?'on':'')+'" data-cat="">전체</button>'+Object.keys(catalog.categories).map(c=>'<button class="chip '+(category===c?'on':'')+'" data-cat="'+safe(c)+'">'+safe(c)+'</button>').join('');root.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;concern='';renderFilters();render();});let tags=category?catalog.categories[category]:Object.values(catalog.categories).flat();$('concerns').innerHTML='<button class="chip '+(!concern?'on':'')+'" data-concern="">모든 고민</button>'+tags.map(t=>'<button class="chip '+(concern===t?'on':'')+'" data-concern="'+safe(t)+'">'+safe(t)+'</button>').join('');$('concerns').querySelectorAll('[data-concern]').forEach(b=>b.onclick=()=>{concern=b.dataset.concern;renderFilters();render()})}
function matches(p){return(!category||p.tags.some(t=>catFor(t)===category))&&(!concern||p.tags.includes(concern))&&(!search||[p.title,p.author,p.tags.join(' '),p.note].join(' ').toLowerCase().includes(search))}
function render(){let arr=catalog.poems.filter(matches);$('total').textContent=`${arr.length}편 / 전체 ${catalog.poems.length}편`;let out=$('results');out.innerHTML=arr.map(p=>{let link=validUrl(p.url),hasText=p.rights==='full'&&!!p.fullText.trim();return `<article class="card"><div class="title">${safe(p.title)}</div><div class="muted">${safe(p.author)} · ${hasText?'전문 열람 가능':link?(link.includes('google.com/search?')?'검색 링크':'외부 원문 링크'):'도서관·서점에서 찾기'}</div><div>${p.tags.map(t=>'<span class="pill">'+safe(t)+'</span>').join('')}</div>${p.note?'<p>처방 이유: '+safe(p.note)+'</p>':''}${p.questions?'<p>감상 질문: '+safe(p.questions)+'</p>':''}${hasText?'<details><summary>시 전문 읽기</summary><pre>'+safe(p.fullText)+'</pre></details>':''}${link?'<p><a href="'+safe(link)+'" target="_blank" rel="noopener noreferrer">'+(link.includes('google.com/search?')?'시 찾아보기 (검색 결과)':'원문·출처 페이지 열기')+'</a></p>':''}</article>`}).join('')||'<div class="box">조건에 맞는 시가 없습니다. 다른 고민이나 검색어를 선택해 보세요.</div>'}
$('query').oninput=e=>{search=e.target.value.trim().toLowerCase();render()};renderFilters();render();</script></body></html>
